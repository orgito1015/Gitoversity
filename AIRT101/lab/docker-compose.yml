name: airt101

services:
  ollama:
    image: ollama/ollama
    # Not published to the host at all: only the app can reach it on the internal network.
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Pulls MODEL once into the ollama volume, then exits. Later starts are instant.
  model-pull:
    image: ollama/ollama
    entrypoint: ["ollama", "pull", "${MODEL:-llama3.2:1b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  app:
    build: .
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      model-pull:
        condition: service_completed_successfully

volumes:
  ollama:
